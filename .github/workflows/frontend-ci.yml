name: Frontend CI

'on':
  push:
    branches:
      - main
      - feat/discovery-ui-search
      - feat/recsys-baseline
      - feat/mission5-recsys-integration
      - feat/mission7c-jjk-landscape-batch-01
      - feat/stage1-security-finalization
  pull_request:
    branches:
      - main
      - feat/stage1-security-finalization

permissions:
  contents: read

jobs:
  validate:
    name: Frontend and Recsys Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python API dependencies
        run: pip install -r server/recsys/requirements.txt "jsonschema[format-nongpl]"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Verify kernel unprivileged namespace capability
        run: |
          # On Ubuntu 24.04, unprivileged user namespaces may be restricted by AppArmor.
          # Explicitly configure unprivileged user namespaces if the sysctl knob is present.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Validate unprivileged user/network namespace capability directly (fail closed immediately if unavailable)
          unshare -rn true || {
            echo "[CI ERROR] Kernel unprivileged user/network namespace creation failed." >&2
            exit 1
          }

      - name: Verify kernel network namespace isolation pre-flight
        run: |
          /usr/bin/env -i \
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            HOME="$HOME" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /bin/bash --noprofile --norc ./scripts/run-isolated-tests.sh --check-isolation

      - name: Run unit and regression tests (network isolated)
        run: |
          /usr/bin/env -i \
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            HOME="$HOME" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /bin/bash --noprofile --norc ./scripts/run-isolated-tests.sh

      - name: Run local media asset checks
        run: pnpm check:assets

      - name: Run content catalog validation
        run: pnpm check:content

      - name: Run production build
        run: pnpm build

      - name: Run recommendation tests
        run: python3 -m unittest discover -s server/recsys/tests -v

      - name: Run catalog drift validation
        run: python3 -m server.recsys.export_catalog --check

      - name: Run recommendation API smoke test
        run: |
          python3 -m uvicorn server.recsys.api:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Bounded readiness polling (up to 15 seconds)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/api/v1/ready | grep -q '"status":"ready"'; then
              echo "Server ready after $i polling intervals"
              break
            fi
            sleep 0.5
          done

          curl -f http://127.0.0.1:8000/api/v1/health
          curl -f http://127.0.0.1:8000/api/v1/ready
          curl -f -X POST http://127.0.0.1:8000/api/v1/recommendations \
            -H "Content-Type: application/json" \
            -d '{"surface":"up_next","current_edit_id":0,"limit":2}'
